<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b5cff"/>
      <stop offset=".55" stop-color="#4a7dff"/>
      <stop offset="1" stop-color="#14c4c4"/>
    </linearGradient>
    <radialGradient id="ga" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 90) scale(560)">
      <stop offset="0" stop-color="#5b5bf0" stop-opacity=".55"/>
      <stop offset="1" stop-color="#5b5bf0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gb" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1080 160) scale(520)">
      <stop offset="0" stop-color="#4a7dff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#4a7dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gc" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(820 640) scale(520)">
      <stop offset="0" stop-color="#14c4c4" stop-opacity=".45"/>
      <stop offset="1" stop-color="#14c4c4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#0d0f1a"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#ga)"/>
  <rect width="1200" height="630" fill="url(#gb)"/>
  <rect width="1200" height="630" fill="url(#gc)"/>

  <g transform="translate(96 104)">
    <rect width="88" height="88" rx="25" fill="url(#logo)"/>
    <g fill="none" stroke="#fff" stroke-linecap="round" stroke-width="7.2" transform="scale(2.75)">
      <path d="M7 11.5q4.5-3.6 9 0t9 0"/>
      <path d="M7 17q4.5-3.6 9 0t5 0" opacity=".85"/>
      <path d="M7 22.5q3-2.4 6 0" opacity=".7"/>
    </g>
    <text x="114" y="64" fill="#eceef8" font-family="'Bricolage Grotesque', 'Geist', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="-1.5">tideline</text>
  </g>

  <text fill="#eceef8" font-family="'Bricolage Grotesque', 'Geist', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="82" font-weight="700" letter-spacing="-3">
    <tspan x="92" y="340">Keep every project</tspan>
    <tspan x="92" y="430">above the tideline.</tspan>
  </text>
  <text x="96" y="506" fill="#a3a9c2" font-family="'Geist', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30">Free, open-source work management for small teams. Every seat, €0.</text>

  <g fill="none" stroke-linecap="round" stroke-width="3">
    <path d="M0 580 q30 -9 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0" stroke="#5b5bf0" stroke-opacity=".7"/>
    <path d="M0 596 q30 -7 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0" stroke="#4a7dff" stroke-opacity=".6"/>
    <path d="M0 612 q30 -5 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0" stroke="#14c4c4" stroke-opacity=".75"/>
  </g>
</svg>
