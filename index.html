<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6d11f" />
    <title>Cue: free, open-source work management from Deep Echo</title>
    <meta
      name="description"
      content="Cue is the free, open-source (MIT) work manager the Deep Echo team runs on: boards with typed columns, ten views, automations and updates. The team workspace is private; the code is yours to run with your own free Firebase project."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Cue: every task has a departure time" />
    <meta property="og:description" content="Free, open-source work management from the Deep Echo team. Private workspace, public code." />
    <meta property="og:image" content="./og.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the saved theme before first paint (same key the app uses) to avoid a flash.
      try {
        var t = localStorage.getItem('tideline:theme')
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/landing/main.tsx"></script>
  </body>
</html>
